<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid & Animation Designs</title>

    <link rel="stylesheet" href="../Assets/css/card.css">
</head>

<body>

    <h1>CSS Grid & Animation Designs</h1>


    <section>

        <h2>1. Grid Card Design</h2>

        <div class="card-container">

           

            <div class="card">

                <img src="../Assets/fruits/strawberry.jpg" alt="strawberry">

                <div class="card-content">

                    <h3>strawberry</h3>

                   

                    <button class="card-btn">Buy</button>

                </div>

            </div>

           

            <div class="card">

                <img src="../Assets/fruits/mango.jpg" alt="Mango" >

                <div class="card-content">

                    <h3>Mango</h3>

                  

                    <button class="card-btn">Buy</button>

                </div>

            </div>

            

            <div class="card">

                <img src="../Assets/fruits/Orange.jpg" alt="Orange">

                <div class="card-content">

                    <h3>Orange</h3>

                   

                    <button class="card-btn">Buy</button>

                </div>

            </div>

        </div>

    </section>


    <section>

        <h2>2. Profile Card</h2>

        <div class="profile-container">

            <div class="profile-card">

                <img src="../Assets/images/Untitled design.png" alt="Profile">

                <h3>ArulKumar</h3>

               

            </div>

        </div>

    </section>


    <section>

        <h2>3. Image Gallery</h2>

        <div class="gallery">

            <div class="gallery-box">
                <img src="../Assets/cards_images/1.png" alt="">
            </div>

            <div class="gallery-box">
                <img src="../Assets/cards_images/2.png" alt="">
            </div>

            <div class="gallery-box">
                <img src="../Assets/cards_images/3.png" alt="">
            </div>

            <div class="gallery-box">
                <img src="../Assets/cards_images/4.png" alt="">
            </div>

        </div>

    </section>


    <section>

        <h2>4. Dashboard Cards</h2>

        <div class="dashboard">

            <div class="dash-card">
                <h3>Customer</h3>
                <p>1800 Active Users</p>
                <button>View</button>
            </div>

            <div class="dash-card">
                <h3>Sales</h3>
                <p>₹15000 Revenue</p>
                <button>View</button>
            </div>

            <div class="dash-card">
                <h3>Shop</h3>
                <p> Running</p>
                <button>View</button>
            </div>

        </div>

    </section>

</body>
</html>
