<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div id="list" >

    </div>

    <script>
        const dataTakes = async()=>{
            const datas = await fetch("https://dummyjson.com/recipes")
            const res = await datas.json()

            const result = res.recipes
            const table = document.getElementById("list")
            // console.log(result);
            result.forEach((e,i) => {
                table.innerHTML +=`
                    <div class="bg-neutral-primary-soft block max-w-sm p-6 m-2 border border-default rounded-base shadow-xs">
                    <h2>Product Name:${e.name}</h2>
                    <img src="${e.image}" width=150>
                    <p>${e.ingredients}</p>
                    </div>
                `
            });
        }
        dataTakes()
    </script>
</body>
</html>
