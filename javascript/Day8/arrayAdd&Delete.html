<script>
    const arr=[1,2,3,4,5,6,7,8,9]
    console.log(arr);
    //add element in end of arr
    arr.push(20)
    console.log("add end element of arr:",arr);
    arr.pop()
    console.log("remove end element of arr:",arr);
    arr.unshift(10)
    console.log("add start element of arr:",arr);
    arr.shift()
    console.log("remove element of arr:",arr);
</script>
