<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Cards</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <section class="max-w-7xl mx-auto px-4 py-12">
        
        <h2 class="text-3xl font-bold text-center mb-10">
            Popular Courses
        </h2>

        <!-- Grid Container -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

            <!-- Card 1 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-2 transition duration-300">
                <img src="https://picsum.photos/400/250?1" alt="Web Development" class="w-full h-52 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-semibold mb-2">Web Development</h3>
                    <p class="text-gray-600 mb-2">Trainer: John Smith</p>
                    <p class="text-green-600 font-bold text-lg mb-4">₹4,999</p>
                    <button class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                        Enroll Now
                    </button>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-2 transition duration-300">
                <img src="https://picsum.photos/400/250?2" alt="Python Programming" class="w-full h-52 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-semibold mb-2">Python Programming</h3>
                    <p class="text-gray-600 mb-2">Trainer: Sarah Lee</p>
                    <p class="text-green-600 font-bold text-lg mb-4">₹5,999</p>
                    <button class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
                        Enroll Now
                    </button>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-2 transition duration-300">
                <img src="https://picsum.photos/400/250?3" alt="Data Science" class="w-full h-52 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-semibold mb-2">Data Science</h3>
                    <p class="text-gray-600 mb-2">Trainer: David Miller</p>
                    <p class="text-green-600 font-bold text-lg mb-4">₹7,999</p>
                    <button class="w-full bg-yellow-500 text-white py-2 rounded-lg hover:bg-yellow-600 transition">
                        Enroll Now
                    </button>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-2 transition duration-300">
                <img src="https://picsum.photos/400/250?4" alt="UI/UX Design" class="w-full h-52 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-semibold mb-2">UI/UX Design</h3>
                    <p class="text-gray-600 mb-2">Trainer: Emma Wilson</p>
                    <p class="text-green-600 font-bold text-lg mb-4">₹3,999</p>
                    <button class="w-full bg-cyan-600 text-white py-2 rounded-lg hover:bg-cyan-700 transition">
                        Enroll Now
                    </button>
                </div>
            </div>

            <!-- Card 5 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-2 transition duration-300">
                <img src="https://picsum.photos/400/250?5" alt="Digital Marketing" class="w-full h-52 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-semibold mb-2">Digital Marketing</h3>
                    <p class="text-gray-600 mb-2">Trainer: Michael Brown</p>
                    <p class="text-green-600 font-bold text-lg mb-4">₹2,999</p>
                    <button class="w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition">
                        Enroll Now
                    </button>
                </div>
            </div>

            <!-- Card 6 -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-2 transition duration-300">
                <img src="https://picsum.photos/400/250?6" alt="Machine Learning" class="w-full h-52 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-semibold mb-2">Machine Learning</h3>
                    <p class="text-gray-600 mb-2">Trainer: Olivia Taylor</p>
                    <p class="text-green-600 font-bold text-lg mb-4">₹8,999</p>
                    <button class="w-full bg-gray-900 text-white py-2 rounded-lg hover:bg-black transition">
                        Enroll Now
                    </button>
                </div>
            </div>

        </div>

    </section>

</body>
</html>
