<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <section>
        <div>
            <h1>Enter the details</h1>
            <form action="">
                <label >Name:
                    <input type="text" id="name" placeholder="Enter the Name" required>
                </label><br><br>
                <label for="">Email
                    <input type="email"  placeholder="Enter Email">
                </label><br><br>
                <label for="">Contact:
                     <input type="tel" maxlength="10"  minlength="10" required>  
                </label><br><br>
                <label for="age">Gender:
                    <input type="radio" name="age">Male
                    <input type="radio" name="age">Female
                </label><br><br>
                <label for="">Skills
                    <input type="checkbox">HTML
                    <input type="checkbox">CSS
                    <input type="checkbox">JS
                </label><br><br>
                <input type="submit">
            </form>
        </div>
    </section>
</body>
</html>
